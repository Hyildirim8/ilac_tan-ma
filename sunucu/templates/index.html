<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>ESP32 Görüntü Toplama</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #preview { border: 1px solid #ccc; width: 480px; height: 360px; object-fit: contain; }
    label, input, button { margin: 6px 0; display:block; }
  </style>
</head>
<body>
  <h2>ESP32 - Son Görüntü</h2>

  <img id="preview" src="/static/latest.jpg" alt="latest image"/>

  <div>
    <label for="drug_name">İlaç Adı / Klasör:</label>
    <input type="text" id="drug_name" placeholder="örnek: parol_500mg"/>
    <button id="saveBtn">Kaydet (dataset klasörüne)</button>
  </div>

  <script>
    function refreshPreview() {
      const img = document.getElementById("preview");
      const now = Date.now();
      img.src = `/static/latest.jpg?t=${now}`;
    }
    setInterval(refreshPreview, 2000);

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const drug = document.getElementById("drug_name").value.trim();
      if (!drug) { alert("İlaç adı gir."); return; }
      const form = new FormData();
      form.append("drug_name", drug);
      const res = await fetch("/save", { method: "POST", body: form });
      const j = await res.json();
      if (res.ok) alert("Kaydedildi: " + j.saved_to);
      else alert("Hata: " + (j.detail || JSON.stringify(j)));
    });
  </script>
</body>
</html>
